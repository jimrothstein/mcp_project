[project]
name = "pauling-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jimrothstein", email = "jimrothstein@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30.0,<2",
    "youtube-studio-mcp>=0.3.0",
]

[project.scripts]
pauling-mcp = "pauling_mcp:main"

[tool.uv]
# Pin major versions that break the youtube-studio-mcp 0.3.0 v1 FastMCP API /
# Google auth stack. Keep resolution on the safe patch/minor set.
constraint-dependencies = ["oauthlib<4"]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"
